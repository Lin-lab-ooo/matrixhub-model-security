<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="2000"
  height="1280"
  viewBox="0 0 2000 1280"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">MatrixHub architecture</title>
  <desc id="description">
    The UI, CLI for Hugging Face login, download, and upload, and Git clone,
    pull, and push access the server. The server contains a UI, authentication
    and authorization middleware, handlers, job processors, domain modules, and
    repository implementations. Domain modules include user, project, role,
    registry, robot account, model, sync policy, sync job, Git, and cleanup.
    External storage includes a database, NFS, S3, and a possible future Redis.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 11 10"
      refX="10"
      refY="5"
      markerWidth="10"
      markerHeight="10"
      orient="auto-start-reverse"
    >
      <path
        d="M 1 1 L 10 5 L 1 9"
        fill="none"
        stroke="#111827"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </marker>
  </defs>

  <rect width="2000" height="1280" fill="#ffffff" />

  <!-- Entry points. -->
  <g fill="#f1f4fc" stroke="#111827" stroke-width="4">
    <rect x="55" y="55" width="240" height="140" rx="12" />
    <rect x="615" y="55" width="490" height="140" rx="12" />
    <rect x="1285" y="55" width="330" height="140" rx="12" />
  </g>

  <g
    fill="none"
    stroke="#111827"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    marker-end="url(#arrow)"
  >
    <path d="M 175 205 L 175 280" />
    <path d="M 860 205 L 860 280" />
    <path d="M 1450 205 L 1450 280" />
  </g>

  <!-- Server boundary and modules. -->
  <rect
    x="45"
    y="290"
    width="1910"
    height="680"
    rx="10"
    fill="#f1f4fc"
    stroke="#111827"
    stroke-width="4"
  />

  <g fill="#f1f4fc" stroke="#111827" stroke-width="4">
    <rect x="100" y="365" width="115" height="555" rx="12" />
    <rect x="240" y="365" width="1450" height="110" rx="12" />
    <rect x="240" y="505" width="1450" height="78" rx="12" />
    <rect x="1715" y="365" width="220" height="220" rx="12" />
    <rect x="240" y="615" width="1695" height="200" rx="12" />
    <rect x="240" y="846" width="1695" height="75" rx="12" />
  </g>

  <!-- Domain modules. -->
  <g fill="#f1f4fc" stroke="#111827" stroke-width="4">
    <rect x="375" y="670" width="100" height="112" rx="12" />
    <rect x="500" y="670" width="138" height="112" rx="12" />
    <rect x="663" y="670" width="100" height="112" rx="12" />
    <rect x="788" y="670" width="138" height="112" rx="12" />
    <rect x="951" y="670" width="160" height="112" rx="12" />
    <rect x="1136" y="670" width="120" height="112" rx="12" />
    <rect x="1281" y="670" width="185" height="112" rx="12" />
    <rect x="1491" y="670" width="160" height="112" rx="12" />
    <rect x="1676" y="670" width="90" height="112" rx="12" />
    <rect x="1790" y="670" width="140" height="112" rx="12" />
  </g>

  <!-- Storage systems. -->
  <g fill="#f1f4fc" stroke="#111827" stroke-width="4">
    <rect x="710" y="1025" width="220" height="220" rx="12" />
    <rect x="955" y="1025" width="220" height="220" rx="12" />
    <rect x="1200" y="1025" width="220" height="220" rx="12" />
  </g>
  <path
    d="M 498 1025 V 1225 C 498 1247 530 1260 570 1260 C 610 1260 642 1247 642 1225 V 1025"
    fill="#e1f6e8"
    stroke="#111827"
    stroke-width="4"
  />
  <ellipse
    cx="570"
    cy="1025"
    rx="72"
    ry="25"
    fill="#e1f6e8"
    stroke="#111827"
    stroke-width="4"
  />

  <!-- Labels. -->
  <g
    fill="#111827"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="500"
  >
    <text x="175" y="140" font-size="34" text-anchor="middle">ui</text>
    <text x="860" y="140" font-size="32" text-anchor="middle">
      cli(hf login/download/upload)
    </text>
    <text x="1450" y="140" font-size="32" text-anchor="middle">
      git clone/pull/push
    </text>

    <text x="55" y="338" font-size="32">server</text>
    <text x="157.5" y="655" font-size="32" text-anchor="middle">ui</text>

    <text x="965" y="414" font-size="32" text-anchor="middle">
      <tspan x="965" dy="0">middleware</tspan>
      <tspan x="965" dy="44">
        authn/authz(login token/ssh key/access token)
      </tspan>
    </text>

    <text x="965" y="556" font-size="32" text-anchor="middle">handlers</text>
    <text x="1825" y="488" font-size="29" text-anchor="middle">
      job processors
    </text>

    <text x="252" y="738" font-size="32">domain</text>

    <text x="425" y="738" font-size="29" text-anchor="middle">user</text>
    <text x="569" y="738" font-size="29" text-anchor="middle">project</text>
    <text x="713" y="738" font-size="29" text-anchor="middle">role</text>
    <text x="857" y="738" font-size="27" text-anchor="middle">registry</text>
    <text x="1031" y="714" font-size="28" text-anchor="middle">
      <tspan x="1031" dy="0">robot</tspan>
      <tspan x="1031" dy="42">account</tspan>
    </text>
    <text x="1196" y="738" font-size="28" text-anchor="middle">model</text>
    <text x="1373.5" y="738" font-size="27" text-anchor="middle">
      syncpolicy
    </text>
    <text x="1571" y="738" font-size="27" text-anchor="middle">syncjob</text>
    <text x="1721" y="738" font-size="28" text-anchor="middle">git</text>
    <text x="1860" y="738" font-size="27" text-anchor="middle">
      cleanup
    </text>

    <text x="1087.5" y="897" font-size="32" text-anchor="middle">
      repo(implementation)
    </text>

    <text x="570" y="1150" font-size="32" text-anchor="middle">db</text>
    <text x="820" y="1147" font-size="32" text-anchor="middle">nfs</text>
    <text x="1065" y="1147" font-size="32" text-anchor="middle">s3</text>
    <text x="1310" y="1147" font-size="32" text-anchor="middle">
      redis(TBD)
    </text>
  </g>
</svg>
