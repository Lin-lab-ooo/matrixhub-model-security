openapi: 3.0.3
info:
  title: MatrixHub Artifact Security API
  version: v1alpha1
  description: >-
    Authenticated, project-authorized model security operations. Mutable revisions
    resolve to immutable commits before a current report or rescan is requested.
    Complete reports identify a scanner generation and immutable task-attempt ID.
    Historical reports are evidence, not current download authorization.
    The hand-written TypeScript client is api/ts/security/v1alpha1/security.ts;
    it reuses the existing SDK fetch source. Browser session cookies, Bearer
    tokens and Basic credentials are handled by MatrixHub's existing middleware.
security:
  - bearerAuth: []
  - basicAuth: []
  - sessionCookie: []
paths:
  /api/security/v1alpha1/models/{namespace}/{name}/report:
    parameters: &scope
      - {name: namespace, in: path, required: true, schema: {type: string, maxLength: 255}}
      - {name: name, in: path, required: true, schema: {type: string, maxLength: 255}}
    get:
      operationId: getModelSecurityReport
      parameters:
        - {name: revision, in: query, schema: {type: string, default: main, maxLength: 1024}}
      responses:
        '200': {description: Current generation report or pending task, content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/security/v1alpha1/models/{namespace}/{name}/history/{reportId}:
    parameters: *scope
    get:
      operationId: getHistoricalSecurityReport
      parameters:
        - {name: reportId, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]*-[1-9][0-9]*$', maxLength: 64}}
      responses:
        '200': {description: Immutable historical evidence, content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/security/v1alpha1/models/{namespace}/{name}/rescan:
    parameters: *scope
    post:
      operationId: rescanModelRevision
      description: Requires model write permission; forces a fresh attempt for the resolved commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties: {revision: {type: string, minLength: 1, maxLength: 1024}}
      responses:
        '202': {description: Durable task accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Task'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/security/v1alpha1/models/{namespace}/{name}/tasks:
    parameters: *scope
    get:
      operationId: listModelSecurityTasks
      parameters: &pagination
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
      responses:
        '200': {description: Model-scoped tasks, content: {application/json: {schema: {$ref: '#/components/schemas/TaskList'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/security/v1alpha1/models/{namespace}/{name}/tasks/{id}/cancel:
    parameters: *scope
    post:
      operationId: cancelModelSecurityTask
      description: Requires write permission; the task must belong to the requested model.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200': {description: Active task canceled, content: {application/json: {schema: {type: object, required: [id, canceled], properties: {id: {type: integer, format: int64}, canceled: {type: boolean}}}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/security/v1alpha1/models/{namespace}/{name}/audits:
    parameters: *scope
    get:
      operationId: listModelSecurityAudits
      parameters: *pagination
      responses:
        '200': {description: Model-scoped audit events, content: {application/json: {schema: {$ref: '#/components/schemas/AuditList'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/security/v1alpha1/models/{namespace}/{name}/policy:
    parameters: *scope
    get:
      operationId: getModelSecurityPolicy
      responses:
        '200': {description: Effective model policy, content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: updateModelSecurityPolicy
      description: Requires project administrator permission; incomplete coverage always denies content.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PolicyInput'}}}
      responses:
        '200': {description: Persisted versioned policy, content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    basicAuth: {type: http, scheme: basic}
    sessionCookie: {type: apiKey, in: cookie, name: token}
  responses:
    Error:
      description: Stable code/message error; unauthenticated 401, forbidden 403, invalid input 400, missing evidence 404, unavailable scanner 503.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties: {code: {type: string}, message: {type: string}}
    State: {type: string, enum: [pending, scanning, pass, warn, block, fail]}
    Severity: {type: string, enum: [low, medium, high, critical]}
    Finding:
      type: object
      required: [engine, rule, severity, message, remediation]
      properties:
        engine: {type: string}
        rule: {type: string}
        severity: {$ref: '#/components/schemas/Severity'}
        message: {type: string}
        remediation: {type: string}
        evidence: {$ref: '#/components/schemas/FindingEvidence'}
    FindingEvidence:
      type: object
      additionalProperties: false
      required: [knownSymbolId, observation, source, archiveMemberChain, streamIndex, opcodeOffset]
      description: >-
        Required evidence for the high-severity pickle.nested-deserialization-reference
        rule from the picklescan engine; optional for legacy findings. A static reference does not prove invocation
        or malicious execution. No payload, raw archive name or callable argument
        is returned. Pickletools supplies zero-based streamIndex and the absolute
        byte offset in that inspected pickle member; Picklescan fallback supplies
        null for both positions. Legacy findings omit this object.
      properties:
        knownSymbolId: {type: string, enum: [torch-storage-load-from-bytes-v1]}
        observation: {type: string, enum: [reference]}
        source: {type: string, enum: [pickletools, picklescan]}
        archiveMemberChain:
          type: array
          nullable: true
          maxItems: 16
          description: Outermost-to-innermost entries; null for an artifact outside an archive.
          items: {$ref: '#/components/schemas/ArchiveMemberEvidence'}
        streamIndex: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991, nullable: true}
        opcodeOffset: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991, nullable: true}
    ArchiveMemberEvidence:
      type: object
      additionalProperties: false
      required: [memberIndex, nameSha256]
      properties:
        memberIndex: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Zero-based archive entry index including directories.}
        nameSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the raw archive name encoded with UTF-8 surrogatepass; gzip uses the empty name.}
    FileReport:
      type: object
      properties:
        path: {type: string}
        blobId: {type: string}
        lfsOid: {type: string}
        declaredSize: {type: integer, format: int64}
        artifactId: {type: string}
        sha256: {type: string}
        size: {type: integer, format: int64}
        type: {type: string}
        generation: {type: string}
        complete: {type: boolean}
        findings: {type: array, nullable: true, items: {$ref: '#/components/schemas/Finding'}}
        engines: {type: object, nullable: true, additionalProperties: {type: string}}
        durationMs: {type: integer, format: int64}
        cached: {type: boolean}
    Report:
      type: object
      required: [reportId, attempt, taskId, repo, revision, generation, state, complete, expectedFiles, files]
      properties:
        reportId: {type: string, description: Empty until a completed attempt has been published.}
        attempt: {type: integer}
        taskId: {type: integer, format: int64}
        repo: {type: string}
        revision: {type: string, pattern: '^[0-9a-f]{40}$'}
        generation: {type: string}
        state: {$ref: '#/components/schemas/State'}
        complete: {type: boolean}
        expectedFiles: {type: integer}
        files: {type: array, nullable: true, items: {$ref: '#/components/schemas/FileReport'}}
        error: {type: string}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        durationMs: {type: integer, format: int64}
        scannedBytes: {type: integer, format: int64}
        cachedFiles: {type: integer}
    Task:
      type: object
      properties:
        id: {type: integer, format: int64}
        repo: {type: string}
        revision: {type: string}
        generation: {type: string}
        state: {$ref: '#/components/schemas/State'}
        trigger: {type: string}
        force: {type: boolean}
        attempt: {type: integer}
        leaseUntil: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        error: {type: string}
    PolicyInput:
      type: object
      additionalProperties: false
      required: [mode, blockSeverity]
      properties:
        mode: {type: string, enum: [enforce, audit]}
        blockSeverity: {$ref: '#/components/schemas/Severity'}
    Policy:
      type: object
      required: [repo, mode, blockSeverity, version, updatedAt]
      properties:
        repo: {type: string}
        mode: {type: string, enum: [enforce, audit]}
        blockSeverity: {$ref: '#/components/schemas/Severity'}
        version: {type: integer, format: int64}
        updatedAt: {type: string, format: date-time}
    Decision:
      type: object
      properties:
        reportId: {type: string}
        allowed: {type: boolean}
        code: {type: string}
        message: {type: string}
        repo: {type: string}
        revision: {type: string}
        path: {type: string}
        sha256: {type: string}
        size: {type: integer, format: int64}
        taskId: {type: integer, format: int64}
        generation: {type: string}
        policyVersion: {type: integer, format: int64}
    Audit:
      type: object
      properties:
        id: {type: integer, format: int64}
        repo: {type: string}
        revision: {type: string}
        actor: {type: string}
        action: {type: string}
        entry: {type: string}
        path: {type: string}
        decision: {$ref: '#/components/schemas/Decision'}
        createdAt: {type: string, format: date-time}
    ListPage:
      type: object
      required: [items, count, limit, offset, hasMore]
      properties:
        count: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
        hasMore: {type: boolean, description: True when the page is full; the next page may be empty.}
    TaskList:
      allOf:
        - {$ref: '#/components/schemas/ListPage'}
        - {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Task'}}}}
    AuditList:
      allOf:
        - {$ref: '#/components/schemas/ListPage'}
        - {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Audit'}}}}
