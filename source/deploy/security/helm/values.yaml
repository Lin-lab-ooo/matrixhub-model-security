# Build and verify these local images; no implicit image downloads.
images:
  app: matrixhub-security:local
  scanner: matrixhub-security-scanner:1.4.6
  pullPolicy: Never
deploymentId: "" # generated by scripts/newsetup/helm_values.py; reuse for upgrades
replicaCount: 1
rules:
  existingClaim: "" # contains the three verified CVD files at its root
  snapshot: "" # verified snapshot identity, generated by the preparation tool
  expiresAt: "0" # verified daily time + SLA, never a startup-relative timeout
  manifest: {} # public verified metadata; generated by helm_values.py
database:
  existingSecret: ""
  secretKey: matrixhub.dsn
  namespace: "" # defaults to the release namespace
  podSelector: {} # required exact MySQL workload labels for egress
persistence:
  data:
    existingClaim: ""
    storageClass: ""
    size: 8Gi
  staging:
    existingClaim: ""
    storageClass: ""
    size: 4Gi
service:
  type: ClusterIP
  httpPort: 3002
  sshPort: 2222
  httpNodePort: 30001
  sshNodePort: 30022
publicURL: http://127.0.0.1:3002
apiResources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: "2", memory: 4Gi}
scanner:
  nativeThreads: 1
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {cpu: "1", memory: 3Gi}
  environment:
    SCAN_MAX_FILE_BYTES: "67108864"
    SCAN_MAX_EXPANDED_BYTES: "134217728"
    SCAN_MAX_MEMBERS: "256"
    SCAN_MAX_DEPTH: "3"
    SCAN_MAX_RATIO: "100"
    SCAN_WALL_SECONDS: "90"
security:
  enabled: true
  mode: enforce
  blockSeverity: high
  socketPath: /run/matrix-security/scanner.sock
  stagingRoot: /input
  maxFileBytes: 67108864
  maxTaskBytes: 268435456
  maxStagingBytes: 2147483648
  maxFiles: 1000
  timeout: 2m
  lease: 2m30s
  pollInterval: 1s
  concurrency: 1
  maxAttempts: 3
  batchFiles: 32
  batchBytes: 268435456
