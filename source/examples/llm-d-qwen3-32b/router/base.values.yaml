# Snapshot of guides/recipes/router/base.values.yaml from llm-d commit
# 7029aac48505752dd51344ce552acc81b0deb774.
router:
  epp:
    replicas: 1
    flags:
      v: 2
    pluginsConfigFile: default-plugins.yaml
    resources:
      requests:
        cpu: "4"
        memory: 8Gi
      limits:
        memory: 16Gi

  inferencePool:
    failureMode: FailOpen

  modelServers:
    # Omit appProtocol from InferencePool for compatibility with older GAIE v1 CRDs.
    # EPP defaults to HTTP when the field is absent.
    protocol: ""

  proxy:
    args:
      - --service-node
      - envoy-sidecar
      - --log-level
      - warn
      - --concurrency
      - "8"
      - --drain-strategy
      - immediate
      - --drain-time-s
      - "60"
      - -c
      - /etc/envoy/envoy.yaml
    resources:
      requests:
        cpu: "4"
        memory: 8Gi
      limits:
        memory: 16Gi

  tracing:
    otelExporterEndpoint: http://localhost:4317
    sampling:
      sampler: parentbased_traceidratio
      samplerArg: "0.1"
